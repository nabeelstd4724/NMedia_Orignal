services:
  api:
    build: .
    ports: ["4000:4000"]
    env_file: ["backend/.env"]
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 4000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
